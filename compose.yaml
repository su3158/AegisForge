services:
  api:
    build: .
    profiles: ["full", "dev", "lab"]
    environment:
      AEGISFORGE_DATABASE_URL: postgresql+psycopg://aegisforge:aegisforge@postgres:5432/aegisforge
      AEGISFORGE_SECRET_KEY: change-me-for-local-dev-only
    ports:
      - "8000:8000"
    volumes:
      - aegisforge-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    profiles: ["full", "dev"]
    command: ["uv", "run", "aegisforge", "worker"]
    environment:
      AEGISFORGE_DATABASE_URL: postgresql+psycopg://aegisforge:aegisforge@postgres:5432/aegisforge
      AEGISFORGE_SECRET_KEY: change-me-for-local-dev-only
    volumes:
      - aegisforge-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    profiles: ["full", "dev", "lab"]
    environment:
      POSTGRES_DB: aegisforge
      POSTGRES_USER: aegisforge
      POSTGRES_PASSWORD: aegisforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisforge -d aegisforge"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.19.0
    profiles: ["lab"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  aegisforge-data:
  postgres-data:
  qdrant-data:
